server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube support - actively maintained, bypasses blocks
    - dependency: "dev.lavalink.youtube:youtube-plugin:+"
      snapshot: false
    # LavaSrc - Spotify, Apple Music, Deezer, Yandex, Flowery TTS
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:+"
      snapshot: false
    # SponsorBlock - skip sponsor segments in YouTube videos
    - dependency: "com.github.topi314.sponsorblock:sponsorblock-plugin:+"
      snapshot: false
  
  server:
    password: ${LAVALINK_PASSWORD:youshallnotpass}
    sources:
      youtube: false  # Disabled - using youtube-plugin instead
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 100
    playerUpdateInterval: 1
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  # YouTube plugin configuration
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - IOS
      - ANDROID_MUSIC
      - TVHTML5EMBEDDED
      - WEB
    # OAuth for better reliability (optional but recommended)
    # Enables access to age-restricted content and improves reliability
    # oauth:
    #   enabled: true
    #   refreshToken: "your_refresh_token"
  
  # LavaSrc configuration
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: true
    spotify:
      clientId: ${SPOTIFY_CLIENT_ID:}
      clientSecret: ${SPOTIFY_CLIENT_SECRET:}
      countryCode: ${SPOTIFY_COUNTRY:US}
      playlistLoadLimit: 100
      albumLoadLimit: 100
    # Apple Music (optional)
    # applemusic:
    #   countryCode: "US"
    #   mediaAPIToken: "your_token"
  
  # SponsorBlock configuration
  sponsorblock:
    enabled: true
    categories:
      - sponsor
      - selfpromo
      - interaction
      - intro
      - outro
      - preview
      - music_offtopic

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics
